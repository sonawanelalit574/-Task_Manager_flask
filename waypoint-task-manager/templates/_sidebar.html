<aside class="sidebar">
  <a class="mark" href="{{ url_for('main.dashboard') }}">Waypoint</a>
  <nav>
    <a href="{{ url_for('main.dashboard') }}" class="{{ 'active' if request.endpoint == 'main.dashboard' else '' }}">Boards</a>
    <a href="{{ url_for('main.inbox') }}" class="{{ 'active' if request.endpoint == 'main.inbox' else '' }}">My work {% if inbox_count %}<em>{{ inbox_count }}</em>{% endif %}</a>
    <a href="{{ url_for('main.agenda') }}" class="{{ 'active' if request.endpoint == 'main.agenda' else '' }}">Agenda</a>
    <a href="{{ url_for('main.search') }}" class="{{ 'active' if request.endpoint == 'main.search' else '' }}">Search</a>
    <a href="{{ url_for('main.project_new') }}" class="{{ 'active' if request.endpoint == 'main.project_new' else '' }}">New project</a>
  </nav>
  <div class="sidebar-foot">
    <a class="who" href="{{ url_for('auth.settings') }}">
      <span class="avatar">{{ current_user.initials }}</span>
      <span>
        <strong>{{ current_user.name }}</strong>
        <small>Settings</small>
      </span>
    </a>
    <form method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <button class="ghost" type="submit">Sign out</button>
    </form>
  </div>
</aside>
