services:
  - type: web
    name: waypoint
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: waypoint-db
          property: connectionString

databases:
  - name: waypoint-db
    plan: free
